name: CLI CI

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "src/lib/boards.ts"
      - "src/lib/source-trust.ts"
      - ".github/workflows/cli-ci.yml"
  pull_request:
    paths:
      - "cli/**"
      - "src/lib/boards.ts"
      - "src/lib/source-trust.ts"
      - ".github/workflows/cli-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: cli

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["18.18.0", 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Check generated board data is in sync with the website catalog
        run: npm run check:boards
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run package:check
      - name: Smoke-test the built CLI
        run: node dist/cli.js rpi5 --ascii --no-color
