name: CLI CI

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "src/lib/boards.ts"
      - "src/lib/source-trust.ts"
      - ".github/workflows/cli-ci.yml"
  pull_request:
    paths:
      - "cli/**"
      - "src/lib/boards.ts"
      - "src/lib/source-trust.ts"
      - ".github/workflows/cli-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: cli

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["18.18.0", 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Check generated board data is in sync with the website catalog
        run: npm run check:boards
      # ESLint 10 requires Node ^20.19 || ^22.13 || >=24, but this package still
      # supports Node 18.18. Linting is a static check that does not vary by
      # runtime, so it runs on the newer legs only; the 18.18 leg still proves
      # Node 18 support through the test, build, and smoke steps below.
      - run: npm run lint
        if: matrix.node != '18.18.0'
      - run: npm test
      - run: npm run build
      - run: npm run package:check
      - name: Smoke-test the built CLI
        run: node dist/cli.js rpi5 --ascii --no-color
      # cli.ts answers completion on its own dynamic-import path, which the
      # vitest suite bypasses by calling runCli directly.
      - name: Smoke-test shell completion through the built entry point
        shell: bash
        run: |
          node dist/cli.js completion bash | grep -q '_ph_complete'
          node dist/cli.js __complete --prefix=rpi5 | grep -qx 'rpi5'
