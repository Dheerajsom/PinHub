name: Hourly board prices

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check retailers without publishing a snapshot"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-board-prices
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Use the repository's declared npm version
        run: npm install --global npm@11.11.0
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish verified prices
        id: refresh
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.PINHUB_PRICES_BLOB_TOKEN }}
          PRICE_DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          args=()
          if [ "$PRICE_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          npm run publish-prices -- --report="$RUNNER_TEMP/price-refresh-report.json" "${args[@]}"
      - name: Report every listing
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/price-refresh-report.json" ]; then
            echo '### Board price refresh' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/price-refresh-report.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
