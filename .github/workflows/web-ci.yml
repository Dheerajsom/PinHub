name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - ".github/workflows/update-prices.yml"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "next-env.d.ts"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - "postcss.config.mjs"
      - "test/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "vitest.config.mts"
      - ".claude/launch.json"
      - ".github/workflows/cli-ci.yml"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - ".github/workflows/update-prices.yml"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "next-env.d.ts"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - "postcss.config.mjs"
      - "test/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "vitest.config.mts"
      - ".claude/launch.json"
      - ".github/workflows/cli-ci.yml"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Use the repository's declared npm version
        run: npm install --global npm@11.11.0
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e -- --workers=2
      - name: Keep Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
