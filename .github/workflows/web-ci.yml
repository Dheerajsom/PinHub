name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "next-env.d.ts"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - "postcss.config.mjs"
      - "test/**"
      - "vitest.config.ts"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "next-env.d.ts"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - "postcss.config.mjs"
      - "test/**"
      - "vitest.config.ts"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.17.0
          cache: npm
      - name: Use the repository's declared npm version
        run: npm install --global npm@11.11.0
      - run: npm ci
      # Scoped to production dependencies until the ESLint toolchain can be
      # audit-clean. The only outstanding high advisory is GHSA-mh99-v99m-4gvg
      # (brace-expansion DoS), reachable solely through eslint-config-next's
      # eslint-plugin-{import,jsx-a11y,react}, which still pin minimatch@3.
      # Neither fix is available yet: a brace-expansion override breaks
      # minimatch@3's v1 function export, and ESLint 10 breaks those same
      # plugins (they call the removed context.getFilename()). Restore the full
      # audit once those plugins ship ESLint 10 support.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
