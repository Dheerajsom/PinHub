version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Next.js 16's lint toolchain currently requires TypeScript < 6.1.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      web-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /cli
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint 8 currently requires TypeScript < 6.1.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      cli-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
