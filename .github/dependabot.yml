version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Major toolchain upgrades require an explicit compatibility review.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      web-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /cli
    schedule:
      interval: weekly
    ignore:
      # Keep automated updates compatible with the CLI's Node 18 support.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      cli-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
